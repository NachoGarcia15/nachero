name: Release

# Al subir una etiqueta vX.Y.Z se construye nachero.exe y se publica en GitHub Releases.
#   git tag v0.6.0 && git push origin v0.6.0

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  exe:
    name: nachero.exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Instalar
        run: python -m pip install -e ".[dev,build]"

      - name: Tests
        run: python -m pytest

      - name: La etiqueta coincide con la versión
        shell: bash
        run: |
          v=$(python -c "import sys; sys.path.insert(0, 'src'); import nachero; print(nachero.__version__)")
          test "v$v" = "${GITHUB_REF_NAME}" || { echo "Etiqueta ${GITHUB_REF_NAME} y versión $v no coinciden"; exit 1; }

      - name: Construir
        run: python scripts/build_exe.py

      - name: Probar el ejecutable
        # Sin consola (--windowed) la salida solo llega si se redirige: aquí va a una tubería.
        # Debe arrancar Python con todo el paquete y decir su versión, sin abrir ninguna ventana.
        shell: bash
        run: |
          v=$(python -c "import sys; sys.path.insert(0, 'src'); import nachero; print(nachero.__version__)")
          out=$(./dist/nachero.exe --version | tr -d '\r')
          echo "$out"
          test "$out" = "Nachero $v" || { echo "nachero.exe --version dice «$out», no «Nachero $v»"; exit 1; }

      - name: Notas de la versión (CHANGELOG)
        shell: bash
        run: |
          python - <<'EOF'
          import os, re
          v = os.environ["GITHUB_REF_NAME"].lstrip("v")
          text = open("CHANGELOG.md", encoding="utf-8").read()
          m = re.search(rf"^## \[{re.escape(v)}\].*?\n(.*?)(?=^## \[|\Z)", text, re.S | re.M)
          notes = (m.group(1).strip() if m else f"Nachero {v}") + "\n\n---\nDescarga `nachero.exe`, abre el cliente de LoL y ejecútalo: se abre en su propia ventana. Windows puede avisar de que es una app desconocida: *Más información → Ejecutar de todas formas*."
          # en UTF-8 y a archivo: la salida estandar de Python en Windows es cp1252
          open("notes.md", "w", encoding="utf-8").write(notes)
          EOF

      - name: Publicar
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/nachero.exe --title "Nachero ${GITHUB_REF_NAME}" --notes-file notes.md
