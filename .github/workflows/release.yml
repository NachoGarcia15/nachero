name: Release

# Al subir una etiqueta vX.Y.Z se construye draftbot.exe y se publica en GitHub Releases.
#   git tag v0.6.0 && git push origin v0.6.0

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  exe:
    name: draftbot.exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Instalar
        run: python -m pip install -e ".[dev,build]"

      - name: Tests
        run: python -m pytest

      - name: La etiqueta coincide con la versión
        shell: bash
        run: |
          v=$(python -c "import sys; sys.path.insert(0, 'src'); import draftbot; print(draftbot.__version__)")
          test "v$v" = "${GITHUB_REF_NAME}" || { echo "Etiqueta ${GITHUB_REF_NAME} y versión $v no coinciden"; exit 1; }

      - name: Construir
        run: python scripts/build_exe.py

      - name: Probar el ejecutable
        shell: bash
        run: ./dist/draftbot.exe --version

      - name: Notas de la versión (CHANGELOG)
        shell: bash
        run: |
          python - <<'EOF' > notes.md
          import os, re
          v = os.environ["GITHUB_REF_NAME"].lstrip("v")
          text = open("CHANGELOG.md", encoding="utf-8").read()
          m = re.search(rf"^## \[{re.escape(v)}\].*?\n(.*?)(?=^## \[|\Z)", text, re.S | re.M)
          print((m.group(1).strip() if m else f"draftbot {v}") + "\n\n---\nDescarga `draftbot.exe`, abre el cliente de LoL y ejecútalo. Windows puede avisar de que es una app desconocida: *Más información → Ejecutar de todas formas*.")
          EOF

      - name: Publicar
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/draftbot.exe --title "draftbot ${GITHUB_REF_NAME}" --notes-file notes.md
