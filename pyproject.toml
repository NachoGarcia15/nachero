[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "nachero"
dynamic = ["version"]
description = "Asistente de draft para League of Legends: picks y bans en soloq y simulador de draft pro"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pywebview>=6.2; sys_platform == 'win32'",  # la ventana de la app (WebView2); lo demás, biblioteca estándar
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10"]
build = [
  "pyinstaller>=6.10",          # scripts/build_exe.py (nachero.exe)
  "resvg-py>=0.5",              # scripts/make_icons.py (SVG -> PNG/ICO)
  "fonttools>=4.50",            # scripts/make_icons.py (texto del logo en trazos)
]

[project.gui-scripts]
nachero = "nachero.app.main:main"

[tool.setuptools.dynamic]
version = { attr = "nachero.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nachero = ["ui/*", "ui/*.ico", "defaults/*.json"]

# ------------------------------------------------------------------ calidad
[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = [
  "E701", "E702",   # varias sentencias por linea en bloques cortos (b += ...; why.append(...))
  "SIM108",         # no forzar ternarios
  "B008",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
packages = ["nachero"]
ignore_missing_imports = true
check_untyped_defs = false
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
